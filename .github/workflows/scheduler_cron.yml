name: ⏰ Abdullah Journey OS Cloud Cron Dispatcher

on:
  schedule:
    # Runs every 5 minutes 24/7 on GitHub Cloud Runners
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  trigger-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Abdullah's Journey OS Scheduler
        run: |
          echo "Triggering Render & Cloud Cron Endpoint..."
          curl -s -X GET "https://abdallah-pro-2026.onrender.com/api/cron" || echo "Render Cron triggered"
